name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-lock.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Generate sample data
        run: python scripts/make_sample_data.py
      - name: Run tests
        run: pytest -q --junitxml=test-results.xml --cov=src --cov-report=xml
      - name: Generate offline example reports
        run: python scripts/evaluate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.os }}-python-${{ matrix.python-version }}
          path: |
            test-results.xml
            coverage.xml
            docs/examples/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t finsight-ai:ci .
      - name: Check application container
        run: |
          docker run -d --name finsight-ci -p 8501:8501 finsight-ai:ci
          for attempt in $(seq 1 30); do
            if docker exec finsight-ci python -c "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3).read() == b'ok'"; then
              exit 0
            fi
            sleep 2
          done
          docker logs finsight-ci
          exit 1
      - name: Clean up
        if: always()
        run: docker rm -f finsight-ci || true
